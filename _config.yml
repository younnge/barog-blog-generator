# GitHub Pages(Jekyll) 빌드 설정.
#
# 목적: 화면(index.html · assets)만 공개하고, 그 밖의 저장소 파일은 웹으로 내보내지 않는다.
# 앱은 기준정보를 서버(/api/config)에서 받으므로 config/*.json 을 정적으로 제공할 필요가 없다.
# 이렇게 하면 의료법 금지어 사전(compliance.json)·기획 문서·서버 코드가
# 공개 주소로 그대로 열리는 일을 막는다. (저장소는 Public 그대로 둔다 — SPEC §14-3)
#
# 주의: 이 목록에 index.html 이나 assets/ 를 넣지 않는다. 넣으면 화면이 안 뜬다.
exclude:
  - config/
  - server/
  - tools/
  - SPEC.md
  - CLAUDE.md
  - HANDOFF.md
  - README.md
  - 사용안내.md
  - render.yaml
  - .gitignore
  - .github/
