# Render 배포 설정.
# 대시보드에서 이 저장소를 연결하면 아래 내용이 그대로 적용된다.
# 값이 sync:false 인 환경변수는 대시보드에서 직접 입력한다(저장소에 남기지 않는다).
services:
  - type: web
    name: barog-blog-generator-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    # healthCheckPath 는 두지 않는다.
    # 무료 인스턴스에서 헬스체크가 간헐적으로 실패하면 Render가 라우팅을 잠시 끊어
    # 사용자에게 빈 404가 나간다(x-render-routing: no-server). 앱의 /api/health 는
    # 화면에서 서버를 미리 깨우는 용도로 계속 쓴다.
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      # 공통 비밀번호 (평문). 대시보드에서 입력.
      - key: APP_PASSWORD
        sync: false
      # 토큰 서명키 (랜덤 문자열). 대시보드에서 입력.
      - key: SESSION_SECRET
        sync: false
      # Claude API 키. 대시보드에서 입력. 저장소에는 절대 적지 않는다.
      # 이 값이 없으면 로그인 단계에서 '아직 준비가 덜 됐어요' 가 뜬다.
      - key: ANTHROPIC_API_KEY
        sync: false
      # 화면이 배포될 주소. 여기 적힌 주소에서만 서버를 호출할 수 있다.
      - key: ALLOWED_ORIGINS
        value: https://younnge.github.io
