# 푸시·PR 마다 점검 스크립트(server/smoke_test.py)를 자동으로 돌린다.
# 로그인·차단·기준정보 개수·의료법 검사·모드 강제를 한 번에 확인한다.
# 실제 Claude 키는 필요 없다 — 점검 스크립트가 가짜 값을 스스로 채운다.
name: 점검

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install httpx

      - name: 점검 실행
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -m server.smoke_test
